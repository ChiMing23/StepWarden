name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
        # 不传 args：packager 默认即可打 zip 并发布到 GitHub Release。
        # 想发 CurseForge 再加 -p <项目数字ID>，想发 Wago 再加 -a <addon-id>。
        # 注意：-g 是 game-version（后面必须跟版本参数），不是"发布到 GitHub"。
