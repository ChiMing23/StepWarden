name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
        with:
          # -g       发布到 GitHub Release（只用 GITHUB_TOKEN，无需额外配置）
          # -p <id>  发布到 CurseForge，需要 CF_API_KEY 和项目数字 ID
          # -w <id>  发布到 WoWAce / Wago，需要 WAGO_API_TOKEN
          # -m       生成手动 changelog（已在 .pkgmeta 里配置）
          args: -g