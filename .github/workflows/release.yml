name: Release

# 只在手动触发时运行。tag push 不再自动打包发布：
# 正式包由本地脚本产出（带正确的目录结构和校验过的 CHANGELOG），
# packager 会自动改写 release 标题、追加 release.json，容易和本地包打架。
on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
